<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista de Compras — Triadnum</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap');
  :root {
    --preto:#0a0a0a; --roxo:#6B21E8; --roxo-claro:#9B5CF6;
    --verde:#22C55E; --amarelo:#F59E0B; --branco:#F8F8F8;
    --cinza:#1a1a1a; --cinza2:#222; --cinza3:#3a3a3a;
    --texto:#d4d4d4; --vermelho:#E53E3E;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--preto); color:var(--texto); font-family:'Syne',sans-serif; min-height:100vh; }

  .header { background:linear-gradient(135deg,#0a0a0a 0%,#1a0a2e 100%); border-bottom:1px solid var(--roxo); padding:24px 20px 16px; }
  .logo-area { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .logo-left { display:flex; align-items:center; gap:10px; }
  .marca { font-size:10px; font-weight:600; letter-spacing:4px; text-transform:uppercase; color:var(--roxo-claro); }
  .header h1 { font-size:22px; font-weight:800; color:var(--branco); margin-bottom:2px; }

  /* BARRA DE MESES */
  .meses-scroll { overflow-x:auto; padding-bottom:4px; margin-top:14px; }
  .meses-scroll::-webkit-scrollbar { height:3px; }
  .meses-scroll::-webkit-scrollbar-track { background:transparent; }
  .meses-scroll::-webkit-scrollbar-thumb { background:var(--roxo); border-radius:2px; }
  .meses-bar { display:flex; gap:6px; min-width:max-content; }
  .mes-btn { background:transparent; border:1px solid var(--cinza3); border-radius:4px; color:#555; font-family:'IBM Plex Mono',monospace; font-size:9px; padding:5px 10px; cursor:pointer; letter-spacing:1px; text-transform:uppercase; transition:all 0.2s; white-space:nowrap; }
  .mes-btn:hover { border-color:var(--roxo-claro); color:var(--roxo-claro); }
  .mes-btn.ativo { background:var(--roxo); border-color:var(--roxo); color:white; font-weight:700; }

  /* TOTAIS */
  .totais { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; padding:14px 20px; background:var(--cinza); border-bottom:1px solid var(--cinza3); }
  .total-card { text-align:center; }
  .total-card-label { font-family:'IBM Plex Mono',monospace; font-size:9px; color:#555; letter-spacing:2px; text-transform:uppercase; margin-bottom:4px; }
  .total-card-valor { font-family:'IBM Plex Mono',monospace; font-size:14px; font-weight:700; }
  .total-card-valor.verde { color:var(--verde); }
  .total-card-valor.amarelo { color:var(--amarelo); }
  .total-card-valor.vermelho { color:var(--vermelho); }
  .total-card-valor.branco { color:var(--branco); }

  /* ORÇAMENTO EDITÁVEL */
  .orcamento-wrap { display:flex; align-items:center; justify-content:center; gap:6px; }
  .orcamento-input { background:transparent; border:none; border-bottom:1px dashed #444; color:var(--amarelo); font-family:'IBM Plex Mono',monospace; font-size:14px; font-weight:700; width:90px; text-align:center; outline:none; padding:2px 4px; }
  .orcamento-input:focus { border-bottom-color:var(--amarelo); }
  .orcamento-label-edit { font-size:9px; color:#444; font-family:'IBM Plex Mono',monospace; }

  .container { padding:16px 20px; max-width:700px; margin:0 auto; }

  /* AÇÕES */
  .acoes { display:flex; gap:8px; margin-bottom:20px; }
  .btn-acao { background:rgba(107,33,232,0.15); border:1px solid rgba(107,33,232,0.3); border-radius:4px; color:var(--roxo-claro); font-family:'IBM Plex Mono',monospace; font-size:10px; padding:7px 14px; cursor:pointer; letter-spacing:1px; transition:all 0.2s; }
  .btn-acao:hover { background:var(--roxo); color:white; border-color:var(--roxo); }
  .btn-acao.salvo { background:var(--verde); border-color:var(--verde); color:white; }

  /* CATEGORIA */
  .categoria { margin-bottom:24px; }
  .cat-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid var(--cinza3); }
  .cat-titulo { font-size:11px; font-weight:700; letter-spacing:3px; text-transform:uppercase; color:var(--roxo-claro); display:flex; align-items:center; gap:8px; }
  .cat-titulo span { font-size:15px; }
  .btn-add-cat { background:rgba(107,33,232,0.15); border:1px solid rgba(107,33,232,0.3); border-radius:3px; color:var(--roxo-claro); font-family:'IBM Plex Mono',monospace; font-size:9px; padding:4px 10px; cursor:pointer; letter-spacing:1px; transition:all 0.2s; }
  .btn-add-cat:hover { background:var(--roxo); color:white; border-color:var(--roxo); }

  /* DESKTOP */
  .tabela-header { display:grid; grid-template-columns:1fr 75px 75px 75px 85px 28px; gap:6px; padding:6px 10px; margin-bottom:4px; }
  .col-label { font-family:'IBM Plex Mono',monospace; font-size:9px; color:#444; letter-spacing:1px; text-transform:uppercase; text-align:center; }
  .col-label:first-child { text-align:left; }

  .item-row { display:grid; grid-template-columns:1fr 75px 75px 75px 85px 28px; gap:6px; align-items:center; background:var(--cinza); border:1px solid var(--cinza3); border-radius:4px; padding:8px 10px; margin-bottom:8px; transition:border-color 0.2s; }
  .item-row:hover { border-color:rgba(107,33,232,0.3); }
  .item-row.completo { opacity:0.5; }
  .item-row.completo .item-nome { text-decoration:line-through; }
  .item-nome { font-size:12px; font-weight:600; color:var(--branco); }

  .campo { background:rgba(255,255,255,0.04); border:1px solid var(--cinza3); border-radius:3px; color:var(--branco); font-family:'IBM Plex Mono',monospace; font-size:11px; padding:5px 6px; width:100%; text-align:center; outline:none; transition:all 0.2s; }
  .campo:focus { border-color:var(--roxo-claro); background:rgba(107,33,232,0.1); }
  .campo.verde { color:var(--verde); border-color:rgba(34,197,94,0.2); }
  .campo.amarelo { color:var(--amarelo); }

  .falta-valor { font-family:'IBM Plex Mono',monospace; font-size:11px; text-align:center; font-weight:700; }
  .falta-valor.ok { color:var(--verde); }
  .falta-valor.pendente { color:var(--amarelo); }

  .btn-del { background:transparent; border:none; color:#333; font-size:14px; cursor:pointer; padding:2px; border-radius:3px; transition:all 0.2s; }
  .btn-del:hover { color:var(--vermelho); background:rgba(229,62,62,0.1); }

  /* MOBILE */
  @media (max-width: 540px) {
    .tabela-header { display:none; }
    .item-row {
      display:flex;
      flex-direction:column;
      align-items:stretch;
      gap:8px;
      padding:12px;
    }
    .item-nome { font-size:13px; margin-bottom:4px; }
    .item-campos-mobile {
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      gap:6px;
    }
    .campo-wrap { display:flex; flex-direction:column; gap:3px; }
    .campo-wrap-label { font-family:'IBM Plex Mono',monospace; font-size:9px; color:#444; letter-spacing:1px; text-transform:uppercase; text-align:center; }
    .campo { font-size:12px; padding:7px 4px; }
    .falta-valor { font-size:12px; padding:7px 4px; background:rgba(255,255,255,0.04); border:1px solid var(--cinza3); border-radius:3px; }
    .item-row-bottom { display:flex; justify-content:space-between; align-items:center; margin-top:4px; }
    .preco-wrap { display:flex; flex-direction:column; gap:3px; flex:1; }
    .preco-wrap-label { font-family:'IBM Plex Mono',monospace; font-size:9px; color:#444; letter-spacing:1px; text-transform:uppercase; }
    .container { padding:12px 14px; }
    .acoes { flex-wrap:wrap; }
  }

  .form-novo { background:rgba(107,33,232,0.06); border:1px dashed rgba(107,33,232,0.2); border-radius:4px; padding:12px; margin-top:8px; display:none; }
  .form-novo.aberto { display:block; }
  .form-novo-grid { display:grid; grid-template-columns:1fr 80px 90px; gap:8px; margin-bottom:8px; }
  .form-novo input { background:var(--cinza); border:1px solid var(--cinza3); border-radius:3px; color:var(--branco); font-family:'Syne',sans-serif; font-size:12px; padding:7px 10px; outline:none; width:100%; }
  .form-novo input:focus { border-color:var(--roxo-claro); }
  .form-novo input::placeholder { color:#444; }
  .form-novo-btns { display:flex; gap:8px; justify-content:flex-end; }
  .btn-confirmar { background:var(--roxo); border:none; border-radius:3px; color:white; font-family:'IBM Plex Mono',monospace; font-size:10px; padding:6px 14px; cursor:pointer; }
  .btn-cancelar { background:transparent; border:1px solid var(--cinza3); border-radius:3px; color:#666; font-family:'IBM Plex Mono',monospace; font-size:10px; padding:6px 14px; cursor:pointer; }

  .mes-vazio { text-align:center; padding:48px 20px; color:#444; font-family:'IBM Plex Mono',monospace; font-size:12px; line-height:1.8; }
  .mes-vazio strong { color:#666; display:block; font-size:14px; margin-bottom:8px; }
</style>
</head>
<body>

<div class="header">
  <div class="logo-area">
    <div class="logo-left">
      <svg width="24" height="24" viewBox="0 0 40 40" fill="none">
        <polygon points="20,4 36,34 4,34" fill="none" stroke="#9B5CF6" stroke-width="2"/>
        <polygon points="20,12 30,28 10,28" fill="#6B21E8" opacity="0.6"/>
      </svg>
      <span class="marca">Triadnum</span>
    </div>
  </div>
  <h1>Lista de Compras</h1>
  <div class="meses-scroll">
    <div class="meses-bar" id="mesesBar"></div>
  </div>
</div>

<div class="totais">
  <div class="total-card">
    <div class="total-card-label">Orçamento</div>
    <div class="orcamento-wrap">
      <span style="font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--amarelo);">R$</span>
      <input class="orcamento-input" id="orcamentoInput" type="number" value="600" min="0" oninput="salvarOrcamento();atualizar()">
    </div>
    <div class="orcamento-label-edit">▲ toque para editar</div>
  </div>
  <div class="total-card">
    <div class="total-card-label">Gasto até agora</div>
    <div class="total-card-valor verde" id="totalGasto">R$ 0,00</div>
  </div>
  <div class="total-card">
    <div class="total-card-label">Saldo</div>
    <div class="total-card-valor branco" id="totalSaldo">R$ 600,00</div>
  </div>
</div>

<div class="container">
  <div class="acoes">
    <button class="btn-acao" id="btnSalvar" onclick="salvar()">💾 Salvar</button>
    <button class="btn-acao" onclick="novoMes()">📅 Novo mês</button>
  </div>
  <div id="app"></div>
</div>

<script>
const MESES_NOMES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const STORAGE_KEY = 'triadnum_lista_v2';

const DADOS_PADRAO = {
  "🥩 Proteínas": [
    { nome:"Peito de frango", planejado:"4kg", comprado:"", preco:"" },
    { nome:"Coxa/sobrecoxa frango", planejado:"2kg", comprado:"", preco:"" },
    { nome:"Carne moída", planejado:"2kg", comprado:"", preco:"" },
    { nome:"Fígado bovino", planejado:"1kg", comprado:"", preco:"" },
    { nome:"Tilápia congelada", planejado:"2kg", comprado:"", preco:"" },
    { nome:"Ovos", planejado:"30 un", comprado:"", preco:"" },
  ],
  "🍚 Carboidratos": [
    { nome:"Arroz branco", planejado:"5kg", comprado:"", preco:"" },
    { nome:"Batata doce", planejado:"3kg", comprado:"", preco:"" },
    { nome:"Feijão carioca", planejado:"2kg", comprado:"1kg", preco:"8.98" },
    { nome:"Lentilha", planejado:"1kg", comprado:"", preco:"" },
  ],
  "🥦 Legumes e Verduras": [
    { nome:"Alface", planejado:"2 pés", comprado:"", preco:"" },
    { nome:"Tomate", planejado:"1kg", comprado:"0.735kg", preco:"8.07" },
    { nome:"Cenoura", planejado:"2kg", comprado:"", preco:"" },
    { nome:"Chuchu", planejado:"2kg", comprado:"", preco:"" },
    { nome:"Abobrinha", planejado:"1kg", comprado:"", preco:"" },
    { nome:"Brócolis", planejado:"500g", comprado:"", preco:"" },
    { nome:"Cebola", planejado:"2kg", comprado:"", preco:"" },
    { nome:"Alho", planejado:"200g", comprado:"", preco:"" },
  ],
  "🍌 Frutas": [
    { nome:"Banana", planejado:"1 cacho", comprado:"", preco:"" },
    { nome:"Mamão ou laranja", planejado:"2 un", comprado:"", preco:"" },
  ],
  "🫙 Gorduras": [
    { nome:"Azeite", planejado:"500ml", comprado:"", preco:"" },
    { nome:"Manteiga P Alegre", planejado:"2 un 500g", comprado:"1 un 500g", preco:"19.80" },
  ],
  "🍞 Pão": [
    { nome:"Pão francês", planejado:"~semana", comprado:"0.480kg", preco:"7.10" },
    { nome:"Pão de sal", planejado:"~semana", comprado:"", preco:"" },
    { nome:"Pão sovado", planejado:"~semana", comprado:"", preco:"" },
  ],
  "☕ Bebidas": [
    { nome:"Café 3 Corações 500g", planejado:"1 pt", comprado:"1 pt", preco:"28.90" },
    { nome:"Chá mate", planejado:"2 cx", comprado:"", preco:"" },
    { nome:"Açúcar", planejado:"1kg", comprado:"", preco:"" },
    { nome:"Leite longa vida BH", planejado:"3 cx", comprado:"1 cx", preco:"4.98" },
  ],
  "🛒 Outros": [
    { nome:"Óleo lubrificante moto", planejado:"1 L", comprado:"1 L", preco:"39.90" },
    { nome:"Desodorante Rex", planejado:"1 un", comprado:"1 un", preco:"10.98" },
    { nome:"Sabão Francis 85g", planejado:"3 un", comprado:"3 un", preco:"6.57" },
    { nome:"Leite condensado BH", planejado:"1 lata", comprado:"1 lata", preco:"5.48" },
    { nome:"Creme de leite BH", planejado:"1 lata", comprado:"1 lata", preco:"2.98" },
  ],
};

let estado = { meses:{}, mesAtual:'' };
let formAberto = null;

function chaveArmazenamento() { return STORAGE_KEY; }

function carregarEstado() {
  try {
    const s = localStorage.getItem(chaveArmazenamento());
    if (s) estado = JSON.parse(s);
  } catch(e) {}

  // Garante mês atual
  const agora = new Date();
  const chave = agora.getFullYear() + '-' + agora.getMonth();
  if (!estado.meses[chave]) {
    estado.meses[chave] = {
      nome: MESES_NOMES[agora.getMonth()] + ' ' + agora.getFullYear(),
      orcamento: 600,
      dados: JSON.parse(JSON.stringify(DADOS_PADRAO))
    };
  }
  if (!estado.mesAtual) estado.mesAtual = chave;
}

function salvarEstado() {
  // Lê campos antes de salvar
  const mes = estado.meses[estado.mesAtual];
  if (!mes) return;
  Object.entries(mes.dados).forEach(([cat, itens]) => {
    const catId = cat.replace(/[^a-z]/gi,'');
    itens.forEach((item, idx) => {
      const row = document.getElementById('item_'+catId+'_'+idx);
      if (row) {
        item.planejado = row.querySelector('.campo-plan')?.value || item.planejado;
        item.comprado = row.querySelector('.campo-comp')?.value || '';
        item.preco = row.querySelector('.campo-preco')?.value || '';
      }
    });
  });
  localStorage.setItem(chaveArmazenamento(), JSON.stringify(estado));
}

function salvar() {
  salvarEstado();
  const btn = document.getElementById('btnSalvar');
  btn.textContent = '✓ Salvo';
  btn.classList.add('salvo');
  setTimeout(() => { btn.textContent = '💾 Salvar'; btn.classList.remove('salvo'); }, 2000);
}

function salvarOrcamento() {
  const mes = estado.meses[estado.mesAtual];
  if (mes) {
    mes.orcamento = parseFloat(document.getElementById('orcamentoInput').value) || 600;
    salvarEstado();
  }
}

function novoMes() {
  const agora = new Date();
  // Próximo mês
  const prox = new Date(agora.getFullYear(), agora.getMonth()+1, 1);
  const chave = prox.getFullYear()+'-'+prox.getMonth();
  const nome = prompt('Nome do mês:', MESES_NOMES[prox.getMonth()]+' '+prox.getFullYear());
  if (!nome) return;
  if (!estado.meses[chave]) {
    estado.meses[chave] = {
      nome,
      orcamento: 600,
      dados: JSON.parse(JSON.stringify(DADOS_PADRAO))
    };
  }
  estado.mesAtual = chave;
  salvarEstado();
  renderMeses();
  renderTudo();
}

function mudarMes(chave) {
  salvarEstado();
  estado.mesAtual = chave;
  salvarEstado();
  renderMeses();
  renderTudo();
}

function renderMeses() {
  const bar = document.getElementById('mesesBar');
  bar.innerHTML = Object.entries(estado.meses).sort().map(([chave, mes]) =>
    `<button class="mes-btn ${chave === estado.mesAtual ? 'ativo' : ''}" onclick="mudarMes('${chave}')">${mes.nome}</button>`
  ).join('');
  // Atualiza orçamento
  const mes = estado.meses[estado.mesAtual];
  if (mes) document.getElementById('orcamentoInput').value = mes.orcamento || 600;
}

function orcamento() {
  return parseFloat(document.getElementById('orcamentoInput').value) || 600;
}

function calcFalta(plan, comp) {
  if (!plan) return '—';
  if (!comp) return plan;
  if (comp === plan) return '✓';
  return 'Parcial';
}

function atualizar() {
  let t = 0;
  document.querySelectorAll('.campo-preco').forEach(i => { t += parseFloat(i.value) || 0; });
  const orc = orcamento();
  const saldo = orc - t;
  document.getElementById('totalGasto').textContent = 'R$ ' + t.toFixed(2).replace('.',',');
  const sEl = document.getElementById('totalSaldo');
  sEl.textContent = 'R$ ' + Math.abs(saldo).toFixed(2).replace('.',',') + (saldo < 0 ? ' acima' : '');
  sEl.className = 'total-card-valor ' + (saldo < 0 ? 'vermelho' : saldo < 100 ? 'amarelo' : 'verde');

  document.querySelectorAll('.item-row').forEach(row => {
    const comp = row.querySelector('.campo-comp')?.value?.trim();
    const plan = row.querySelector('.campo-plan')?.value?.trim();
    const fEl = row.querySelector('.falta-valor');
    if (fEl) {
      const f = calcFalta(plan, comp);
      fEl.textContent = f;
      fEl.className = 'falta-valor ' + (f === '✓' ? 'ok' : 'pendente');
    }
    if (comp && plan && comp === plan) row.classList.add('completo');
    else row.classList.remove('completo');
  });

  clearTimeout(window._saveTimer);
  window._saveTimer = setTimeout(salvarEstado, 1000);
}

function renderItem(cat, item, idx) {
  const catId = cat.replace(/[^a-z]/gi,'');
  const id = 'item_'+catId+'_'+idx;
  const falta = calcFalta(item.planejado, item.comprado);
  return `<div class="item-row ${item.comprado && item.comprado===item.planejado?'completo':''}" id="${id}">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;">
      <div class="item-nome">${item.nome}</div>
      <button class="btn-del" onclick="deletarItem('${cat}',${idx})" title="Remover">✕</button>
    </div>
    <div class="item-campos-mobile">
      <div class="campo-wrap">
        <div class="campo-wrap-label">Planejado</div>
        <input class="campo campo-plan" value="${item.planejado}" placeholder="Qtd" oninput="atualizar()" title="Planejado">
      </div>
      <div class="campo-wrap">
        <div class="campo-wrap-label">Comprado</div>
        <input class="campo campo-comp verde" value="${item.comprado}" placeholder="—" oninput="atualizar()" title="Comprado">
      </div>
      <div class="campo-wrap">
        <div class="campo-wrap-label">Falta</div>
        <div class="falta-valor ${falta==='✓'?'ok':'pendente'}">${falta}</div>
      </div>
    </div>
    <div class="preco-wrap">
      <div class="preco-wrap-label">Preço R$</div>
      <input class="campo campo-preco amarelo" type="number" value="${item.preco}" placeholder="0,00" step="0.01" min="0" oninput="atualizar()" title="Preço R$">
    </div>
  </div>`;
}

function renderCategoria(cat, itens) {
  const catId = cat.replace(/[^a-z]/gi,'');
  return `<div class="categoria" id="cat_${catId}">
    <div class="cat-header">
      <div class="cat-titulo"><span>${cat.split(' ')[0]}</span>${cat.split(' ').slice(1).join(' ')}</div>
      <button class="btn-add-cat" onclick="abrirForm('${cat}')">+ Adicionar</button>
    </div>
    <div class="tabela-header">
      <div class="col-label">Item</div>
      <div class="col-label">Planejado</div>
      <div class="col-label">Comprado</div>
      <div class="col-label">Falta</div>
      <div class="col-label">Preço R$</div>
      <div class="col-label"></div>
    </div>
    <div id="itens_${catId}">${itens.map((item,idx) => renderItem(cat,item,idx)).join('')}</div>
    <div class="form-novo" id="form_${catId}">
      <div class="form-novo-grid">
        <input type="text" id="novo_nome_${catId}" placeholder="Nome do produto...">
        <input type="text" id="novo_qtd_${catId}" placeholder="Qtd planejada">
        <input type="number" id="novo_preco_${catId}" placeholder="Preço R$" step="0.01" min="0">
      </div>
      <div class="form-novo-btns">
        <button class="btn-cancelar" onclick="fecharForm('${catId}')">Cancelar</button>
        <button class="btn-confirmar" onclick="adicionarItem('${cat}','${catId}')">Confirmar</button>
      </div>
    </div>
  </div>`;
}

function renderTudo() {
  const mes = estado.meses[estado.mesAtual];
  const app = document.getElementById('app');
  if (!mes) { app.innerHTML = '<div class="mes-vazio"><strong>Nenhum mês selecionado</strong></div>'; return; }
  app.innerHTML = Object.entries(mes.dados).map(([cat,itens]) => renderCategoria(cat,itens)).join('');
  atualizar();
}

function abrirForm(cat) {
  const catId = cat.replace(/[^a-z]/gi,'');
  if (formAberto && formAberto !== catId) fecharForm(formAberto);
  document.getElementById('form_'+catId).classList.add('aberto');
  formAberto = catId;
  document.getElementById('novo_nome_'+catId).focus();
}

function fecharForm(catId) {
  const f = document.getElementById('form_'+catId);
  if (f) {
    f.classList.remove('aberto');
    ['novo_nome_','novo_qtd_','novo_preco_'].forEach(p => { const el = document.getElementById(p+catId); if(el) el.value=''; });
  }
  formAberto = null;
}

function adicionarItem(cat, catId) {
  const nome = document.getElementById('novo_nome_'+catId).value.trim();
  const qtd = document.getElementById('novo_qtd_'+catId).value.trim();
  const preco = document.getElementById('novo_preco_'+catId).value.trim();
  if (!nome) return;
  const mes = estado.meses[estado.mesAtual];
  if (!mes.dados[cat]) mes.dados[cat] = [];
  mes.dados[cat].push({ nome, planejado:qtd, comprado:'', preco });
  fecharForm(catId);
  renderTudo();
  salvarEstado();
}

function deletarItem(cat, idx) {
  const mes = estado.meses[estado.mesAtual];
  mes.dados[cat].splice(idx,1);
  renderTudo();
  salvarEstado();
}

carregarEstado();
renderMeses();
renderTudo();
</script>
</body>
</html>
